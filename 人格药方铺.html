<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人格药方铺 · 测测你是哪味药</title>
    <style>
        :root {
            --bg-color: #f5f0e6;
            --card-color: #fffaf0;
            --ink-color: #3e2723;
            --accent-color: #8b4513;
            --border-color: #d3c4b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: "Songti SC", "SimSun", "Source Han Serif CN", serif;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .subtitle {
            text-align: center;
            color: #6d5d53;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .question-block {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .options label {
            display: block;
            padding: 10px 15px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .options label:hover {
            background-color: #fdf6ec;
            border-color: var(--accent-color);
        }

        input[type="radio"] {
            margin-right: 10px;
            accent-color: var(--accent-color);
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-family: inherit;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #6b3410;
        }

        /* 结果页样式 */
        #result {
            display: none;
        }

        .result-header {
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .result-type {
            font-size: 1.8em;
            color: var(--accent-color);
            font-weight: bold;
        }

        .result-subtitle {
            font-size: 1.1em;
            margin-top: 5px;
            color: #5d4037;
        }

        .result-section {
            margin-bottom: 20px;
        }

        .result-section h3 {
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85em;
            color: #8d7c74;
        }

        .restart-btn {
            background-color: #556b2f;
        }

        .restart-btn:hover {
            background-color: #3e4f22;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 问卷页 -->
    <div id="quiz">
        <h1>人格药方铺</h1>
        <p class="subtitle">
            草木有药性，人有性情。<br>
            回答十个问题，看看你的性格最像哪一味药。
        </p>

        <form id="quizForm">

            <div class="question-block">
                <div class="question-title">1. 朋友陷入低谷，你最本能的做法是？</div>
                <div class="options">
                    <label><input type="radio" name="q1" value="A"> 帮他梳理问题，指出关键所在</label>
                    <label><input type="radio" name="q1" value="B"> 默默陪着，听他说话，不急着给建议</label>
                    <label><input type="radio" name="q1" value="C"> 拉他出门、换个环境，做点别的事</label>
                    <label><input type="radio" name="q1" value="D"> 说几句有分量的话，让他突然想通</label>
                    <label><input type="radio" name="q1" value="E"> 用自己的热情带动他，让他振作起来</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">2. 面对突发变故，你的第一反应是？</div>
                <div class="options">
                    <label><input type="radio" name="q2" value="A"> 先冷静，弄清原因再行动</label>
                    <label><input type="radio" name="q2" value="B"> 有点慌，但会先稳住自己情绪</label>
                    <label><input type="radio" name="q2" value="C"> 马上行动，先把眼前的事处理掉</label>
                    <label><input type="radio" name="q2" value="D"> 停下来观察，等看清局势再决定</label>
                    <label><input type="radio" name="q2" value="E"> 迅速调整状态，努力适应变化</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">3. 你处理情绪的方式更接近？</div>
                <div class="options">
                    <label><input type="radio" name="q3" value="A"> 自己想通，很少表达出来</label>
                    <label><input type="radio" name="q3" value="B"> 找信任的人倾诉</label>
                    <label><input type="radio" name="q3" value="C"> 通过运动、忙碌或转移注意力排解</label>
                    <label><input type="radio" name="q3" value="D"> 换个角度想，一笑置之</label>
                    <label><input type="radio" name="q3" value="E"> 憋在心里，等时间慢慢消化</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">4. 别人最常评价你哪一点？</div>
                <div class="options">
                    <label><input type="radio" name="q4" value="A"> 清醒、理智、有主见</label>
                    <label><input type="radio" name="q4" value="B"> 温柔、体贴、会照顾人</label>
                    <label><input type="radio" name="q4" value="C"> 灵活、点子多、反应快</label>
                    <label><input type="radio" name="q4" value="D"> 坚韧、能扛事、不轻易放弃</label>
                    <label><input type="radio" name="q4" value="E"> 热情、有感染力、能带动气氛</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">5. 压力之下，你最容易出现的状态是？</div>
                <div class="options">
                    <label><input type="radio" name="q5" value="A"> 烦躁、易怒、看什么都不顺眼</label>
                    <label><input type="radio" name="q5" value="B"> 疲惫、无力、什么都不想管</label>
                    <label><input type="radio" name="q5" value="C"> 焦虑、紧绷、坐立难安</label>
                    <label><input type="radio" name="q5" value="D"> 钻牛角尖、反复想同一件事</label>
                    <label><input type="radio" name="q5" value="E"> 表面平静，但身体很僵硬</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">6. 你更向往哪种生活状态？</div>
                <div class="options">
                    <label><input type="radio" name="q6" value="A"> 清晰、有序、少干扰</label>
                    <label><input type="radio" name="q6" value="B"> 安稳、温暖、有人陪伴</label>
                    <label><input type="radio" name="q6" value="C"> 新鲜、自由、充满变化</label>
                    <label><input type="radio" name="q6" value="D"> 踏实、有积累、长期稳定</label>
                    <label><input type="radio" name="q6" value="E"> 热烈、充实、有挑战性</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">7. 你最大的内在优势是？</div>
                <div class="options">
                    <label><input type="radio" name="q7" value="A"> 看清本质，不被情绪左右</label>
                    <label><input type="radio" name="q7" value="B"> 有耐心，能长期陪伴和坚持</label>
                    <label><input type="radio" name="q7" value="C"> 思维灵活，总能找到新解法</label>
                    <label><input type="radio" name="q7" value="D"> 行动力强，能推动事情前进</label>
                    <label><input type="radio" name="q7" value="E"> 情绪稳定，是别人的依靠</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">8. 你最容易被哪种困境困住？</div>
                <div class="options">
                    <label><input type="radio" name="q8" value="A"> 混乱不清、没人说真话的局面</label>
                    <label><input type="radio" name="q8" value="B"> 孤立无援、所有事都要自己扛</label>
                    <label><input type="radio" name="q8" value="C"> 被规则卡住、无法突破瓶颈</label>
                    <label><input type="radio" name="q8" value="D"> 犹豫不决、不知道如何选择</label>
                    <label><input type="radio" name="q8" value="E"> 环境压抑、找不到出口</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">9. 在团队中，你通常扮演？</div>
                <div class="options">
                    <label><input type="radio" name="q9" value="A"> 判断者：负责纠偏和决策</label>
                    <label><input type="radio" name="q9" value="B"> 协调者：负责照顾氛围和关系</label>
                    <label><input type="radio" name="q9" value="C"> 破局者：负责打开新局或新思路</label>
                    <label><input type="radio" name="q9" value="D"> 执行者：负责把事落地、扛住压力</label>
                    <label><input type="radio" name="q9" value="E"> 稳定者：负责兜底和维持节奏</label>
                </div>
            </div>

            <div class="question-block">
                <div class="question-title">10. 如果给自己一句提醒，你更需要哪一句？</div>
                <div class="options">
                    <label><input type="radio" name="q10" value="A"> 不必事事正确，也可以允许自己柔软</label>
                    <label><input type="radio" name="q10" value="B"> 你值得被照顾，不必总是独自支撑</label>
                    <label><input type="radio" name="q10" value="C"> 想法重要，但持续行动更重要</label>
                    <label><input type="radio" name="q10" value="D"> 慢一点没关系，稳比快更长久</label>
                    <label><input type="radio" name="q10" value="E"> 热情需要边界，燃烧自己不如照亮别人</label>
                </div>
            </div>

            <button type="button" onclick="calculateResult()">抓药 · 查看结果</button>
        </form>
    </div>

    <!-- 结果页 -->
    <div id="result">
        <div class="result-header">
            <div class="result-type" id="resType"></div>
            <div class="result-subtitle" id="resSubtitle"></div>
        </div>

        <div class="result-section">
            <h3>药性归经</h3>
            <p id="resNature"></p>
        </div>

        <div class="result-section">
            <h3>性格画像</h3>
            <p id="resPersonality"></p>
        </div>

        <div class="result-section">
            <h3>用药提醒</h3>
            <p id="resAdvice"></p>
        </div>

        <button class="restart-btn" onclick="restartQuiz()">再测一次</button>

        <div class="footer">
            人格药方铺 · 此方仅供自省，不服来辩
        </div>
    </div>
</div>

<script>
    // 计分逻辑
    const scoreMap = {

            advice: '解表贵在“汗而勿伤”。你可以快，但也要学会停；你可以透，但也要学会藏。发散太过，正气易虚，记得给自己的能量留一点余量。'

            title: '祛风湿药型人格',

        },
        '开窍药': {
            title: '开窍药型人格',
            subtitle: '辛香走窜，善开窍醒神',
            nature: '性味辛香。善开窍醒神、辟秽化浊。如麝香、冰片之属，辛香走窜，无孔不入，能通诸窍之不利。',
            personality: '你像一剂开窍药，辛香走窜，灵动非凡。你点子多、反应快，一句话就能点醒别人，是天生的开导者。当别人困在死胡同时，你总能给出一个意想不到的角度，让人豁然开朗。但辛香易耗气，你容易浮躁、三分钟热度，灵感很多却难落地。',

    };

    function calculateResult() {
        const answers = {};
        let allAnswered = true;

        for (let i = 1; i <= 10; i++) {
            const qName = `q${i}`;
            const selected = document.querySelector(`input[name="${qName}"]:checked`);
            if (!selected) {
                allAnswered = false;
                break;
            }
            answers[qName] = selected.value;
        }

        if (!allAnswered) {
            alert('请答完所有题目，掌柜才好为你抓药。');
            return;
        }

        // 统计得分
        const scores = {
            '清热药': 0, '平肝息风药': 0, '补虚药': 0,
            '解表药': 0, '开窍药': 0, '祛风湿药': 0,
            '活血化瘀药': 0, '温里药': 0
        };

        Object.values(answers).forEach(val => {
            const types = scoreMap[val];
            if (types.length === 1) {
                scores[types[0]] += 2; // 主倾向分高
            } else {
                // 混合倾向，各给1分
                scores[types[0]] += 1;
                scores[types[1]] += 1;
            }
        });

        // 找出最高分
        let maxScore = -1;
        let resultType = '';
        for (const type in scores) {
            if (scores[type] > maxScore) {
                maxScore = scores[type];
                resultType = type;
            }
        }

        // 显示结果
        showResult(resultType);
    }

    function showResult(type) {
        const data = herbData[type];
        document.getElementById('resType').innerText = data.title;
        document.getElementById('resSubtitle').innerText = data.subtitle;
        document.getElementById('resNature').innerText = data.nature;
        document.getElementById('resPersonality').innerText = data.personality;
        document.getElementById('resAdvice').innerText = data.advice;

        document.getElementById('quiz').style.display = 'none';
        document.getElementById('result').style.display = 'block';
    }

    function restartQuiz() {
        document.getElementById('quizForm').reset();
        document.getElementById('result').style.display = 'none';
        document.getElementById('quiz').style.display = 'block';
    }
</script>

</body>
